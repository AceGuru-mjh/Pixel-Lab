name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Assemble (native arm64 + x86_64)
        run: gradle assemble --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lab-sample
          path: sample-app/build/outputs/apk/debug/*.apk

  native-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: g++ syntax + warnings gate
        run: |
          CPP=pixel-core/src/main/cpp
          FAIL=0
          for f in $(find $CPP -name '*.cpp'); do
            g++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -fsyntax-only -I$CPP $f || FAIL=1
          done
          exit $FAIL

  jvm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compile pixel-core with kotlinc (pure JVM gate)
        run: |
          curl -sL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          curl -sL -o /tmp/coroutines.jar https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.9.0/kotlinx-coroutines-core-jvm-1.9.0.jar
          /tmp/kotlinc-dist/kotlinc/bin/kotlinc -cp /tmp/coroutines.jar -d /tmp/out \
            $(find pixel-core/src/main/kotlin -name '*.kt')
