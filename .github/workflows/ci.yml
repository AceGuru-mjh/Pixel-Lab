name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Compilation gates for every push and pull request.
#
#   • jvm-compile  — kotlinc compiles pixel-core main + test sources against
#                    pure-JVM dependencies (no Android SDK needed). Fast
#                    feedback on type errors, API misuse, visibility issues.
#   • jvm-test     — runs the pixel-core unit-test suite through the JUnit
#                    Platform console launcher (no Gradle required).
#   • gradle-build — the real thing: ./gradlew assembles every module with
#                    AGP 8.7.3, the Android SDK and the NDK CMake toolchain,
#                    then runs :pixel-core:testDebugUnitTest and uploads the
#                    sample APK as an artifact.
#   • native-syntax— g++ -Wall -Wextra syntax gate over every C++ translation
#                    unit with the JDK JNI headers on the include path.
#
# The workflow file previously shipped in this repository had a corrupted
# trigger (`branches: ain]`) and three broken jobs (Gradle 8.1 parsed from an
# unquoted `8.10`, a missing JNI include path, and a doubled kotlinc path).
# All PRs merged before this fix show red checks; this rewrite is the fix.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**', 'feat/**']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-compile:
    name: JVM compile gate (kotlinc)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache kotlinc and compile jars
        uses: actions/cache@v4
        with:
          path: |
            ~/pl-kotlinc
            /tmp/pl-libs
          key: kotlinc-2.0.21-libs-v2

      - name: Install Kotlin compiler 2.0.21
        run: |
          # The official zip's top-level directory name has varied across
          # releases (kotlinc/ vs kotlinc-dist/); extract, locate the
          # binary, stage it under one fixed path.
          if [ ! -x "$HOME/pl-kotlinc/bin/kotlinc" ]; then
            curl -sL -f https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
            rm -rf /tmp/kotlin-extract && mkdir -p /tmp/kotlin-extract
            unzip -q /tmp/kotlin.zip -d /tmp/kotlin-extract
            BIN=$(find /tmp/kotlin-extract -type f -name kotlinc | head -n 1)
            [ -n "$BIN" ] || { echo "kotlinc binary not found in archive"; exit 1; }
            mkdir -p "$HOME/pl-kotlinc"
            cp -r "$(dirname "$(dirname "$BIN")")/." "$HOME/pl-kotlinc/"
          fi
          "$HOME/pl-kotlinc/bin/kotlinc" -version

      - name: Fetch pure-JVM compile libraries
        run: |
          mkdir -p /tmp/pl-libs
          fetch() { [ -f "/tmp/pl-libs/$2" ] || curl -sL -f -o "/tmp/pl-libs/$2" "$1"; echo "$2 ok"; }
          fetch https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.9.0/kotlinx-coroutines-core-jvm-1.9.0.jar kotlinx-coroutines-core-jvm-1.9.0.jar
          fetch https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-test/2.0.21/kotlin-test-2.0.21.jar kotlin-test-2.0.21.jar
          fetch https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar junit-4.13.2.jar
          fetch https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar hamcrest-core-1.3.jar

      - name: Materialize compile-time Android stubs
        run: |
          # Two boundary files (BitmapIo.kt, Exporter.kt) reference
          # android.graphics.Bitmap and android.os.Build. The JVM gate
          # compiles them against these minimal API stubs — the full
          # truth lives in the Gradle AGP job.
          mkdir -p /tmp/pl-stubs/android/graphics /tmp/pl-stubs/android/os
          cat > /tmp/pl-stubs/android/graphics/Bitmap.kt <<'KSTUB'
          package android.graphics
          import java.io.OutputStream
          class Bitmap private constructor() {
              companion object {
                  @JvmStatic fun createBitmap(pixels: IntArray, width: Int, height: Int, config: Config): Bitmap = Bitmap()
                  @JvmStatic fun createBitmap(width: Int, height: Int, config: Config): Bitmap = Bitmap()
                  @JvmStatic fun createScaledBitmap(src: Bitmap, width: Int, height: Int, filter: Boolean): Bitmap = Bitmap()
              }
              enum class Config { ALPHA_8, RGB_565, ARGB_8888 }
              enum class CompressFormat { JPEG, PNG, WEBP, WEBP_LOSSLESS }
              val width: Int = 1
              val height: Int = 1
              val config: Config = Config.ARGB_8888
              fun getPixels(pixels: IntArray, offset: Int, stride: Int, x: Int, y: Int, width: Int, height: Int) {}
              fun setPixels(pixels: IntArray, offset: Int, stride: Int, x: Int, y: Int, width: Int, height: Int) {}
              fun copy(config: Config, isMutable: Boolean): Bitmap = Bitmap()
              fun recycle() {}
              fun isRecycled(): Boolean = false
              fun compress(format: CompressFormat, quality: Int, stream: OutputStream): Boolean = true
          }
          KSTUB
          cat > /tmp/pl-stubs/android/os/Build.kt <<'KSTUB'
          package android.os
          object Build {
              object VERSION {
                  const val SDK_INT: Int = 34
              }
              const val VERSION_CODES_BASE: Int = 1
              val MANUFACTURER: String = "stub"
              val MODEL: String = "stub"
          }
          KSTUB

      - name: Compile pixel-core main sources
        run: |
          CP="/tmp/pl-libs/kotlinx-coroutines-core-jvm-1.9.0.jar"
          "$HOME/pl-kotlinc/bin/kotlinc" -cp "$CP" -jvm-target 17 -d /tmp/out-main \
            $(find pixel-core/src/main/kotlin -name '*.kt' | sort)

      - name: Compile pixel-core test sources
        run: |
          CP="/tmp/out-main:/tmp/pl-libs/kotlinx-coroutines-core-jvm-1.9.0.jar:/tmp/pl-libs/kotlin-test-2.0.21.jar:/tmp/pl-libs/junit-4.13.2.jar"
          if [ -d pixel-core/src/test/kotlin ] && find pixel-core/src/test/kotlin -name '*.kt' | grep -q .; then
            "$HOME/pl-kotlinc/bin/kotlinc" -cp "$CP" -jvm-target 17 -d /tmp/out-test \
              $(find pixel-core/src/test/kotlin -name '*.kt' | sort)
          else
            echo "No test sources present; skipping test compile."
          fi

      - name: Upload compiled classes (for the test job)
        uses: actions/upload-artifact@v4
        with:
          name: jvm-classes
          path: /tmp/out-main
          retention-days: 1
          if-no-files-found: error

  jvm-test:
    name: JVM unit tests (JUnit Platform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: jvm-compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: jvm-classes
          path: /tmp/out-main

      - name: Cache kotlinc and runner jars
        uses: actions/cache@v4
        with:
          path: |
            ~/pl-kotlinc
            /tmp/pl-libs
          key: kotlinc-2.0.21-testlibs-v2

      - name: Install Kotlin compiler + fetch runner libraries
        run: |
          if [ ! -x "$HOME/pl-kotlinc/bin/kotlinc" ]; then
            curl -sL -f https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
            rm -rf /tmp/kotlin-extract && mkdir -p /tmp/kotlin-extract
            unzip -q /tmp/kotlin.zip -d /tmp/kotlin-extract
            BIN=$(find /tmp/kotlin-extract -type f -name kotlinc | head -n 1)
            [ -n "$BIN" ] || { echo "kotlinc binary not found in archive"; exit 1; }
            mkdir -p "$HOME/pl-kotlinc"
            cp -r "$(dirname "$(dirname "$BIN")")/." "$HOME/pl-kotlinc/"
          fi
          mkdir -p /tmp/pl-libs
          fetch() { [ -f "/tmp/pl-libs/$2" ] || curl -sL -f -o "/tmp/pl-libs/$2" "$1"; }
          fetch https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.9.0/kotlinx-coroutines-core-jvm-1.9.0.jar kotlinx-coroutines-core-jvm-1.9.0.jar
          fetch https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-test/2.0.21/kotlin-test-2.0.21.jar kotlin-test-2.0.21.jar
          fetch https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar junit-4.13.2.jar
          fetch https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar hamcrest-core-1.3.jar
          fetch https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.3/junit-platform-console-standalone-1.10.3.jar junit-platform-console-standalone-1.10.3.jar
          fetch https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.jar kotlin-stdlib-2.0.21.jar

      - name: Compile test sources against downloaded classes
        run: |
          if find pixel-core/src/test/kotlin -name '*.kt' 2>/dev/null | grep -q .; then
            CP="/tmp/out-main:/tmp/pl-libs/kotlinx-coroutines-core-jvm-1.9.0.jar:/tmp/pl-libs/kotlin-test-2.0.21.jar:/tmp/pl-libs/junit-4.13.2.jar"
            "$HOME/pl-kotlinc/bin/kotlinc" -cp "$CP" -jvm-target 17 -d /tmp/out-test \
              $(find pixel-core/src/test/kotlin -name '*.kt' | sort)
          else
            echo "No test sources present; test run will be skipped."
            mkdir -p /tmp/out-test/.empty
          fi

      - name: Run tests (JUnit Platform console)
        run: |
          CP="/tmp/out-main:/tmp/out-test:/tmp/pl-libs/kotlinx-coroutines-core-jvm-1.9.0.jar:/tmp/pl-libs/kotlin-test-2.0.21.jar:/tmp/pl-libs/junit-4.13.2.jar:/tmp/pl-libs/hamcrest-core-1.3.jar:/tmp/pl-libs/kotlin-stdlib-2.0.21.jar"
          CLASSES=$(find /tmp/out-test -name '*Kt.class' -o -name '*Test.class' | wc -l)
          if [ "$CLASSES" -gt 0 ]; then
            java -jar /tmp/pl-libs/junit-platform-console-standalone-1.10.3.jar \
              --class-path "$CP" \
              --scan-class-path \
              --details tree \
              --fail-if-no-tests
          else
            echo "No test classes were compiled; nothing to run."
          fi

  gradle-build:
    name: Gradle build (AGP + NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper, quoted — 8.10 unquoted parses as 8.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble every module (native arm64-v8a + x86_64)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run pixel-core unit tests
        run: ./gradlew :pixel-core:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lab-sample-apk
          path: sample-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-core-test-reports
          path: pixel-core/build/reports/tests/**

  native-syntax:
    name: C++ syntax + warnings gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (provides jni.h)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: g++ syntax + warnings gate with JNI and NDK headers
        run: |
          CPP=pixel-core/src/main/cpp
          JNI_INC="-I$JAVA_HOME/include -I$JAVA_HOME/include/linux"
          # jni_core.cpp includes <android/log.h> from the NDK sysroot;
          # pick the newest installed NDK when one is present.
          NDK_SYSROOT=$(ls -d $ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_SYSROOT" ]; then
            JNI_INC="$JNI_INC -I$NDK_SYSROOT/usr/include -I$NDK_SYSROOT/usr/include/aarch64-linux-android"
          else
            echo "warning: no NDK found; android/* headers unavailable" >&2
          fi
          FAIL=0
          for f in $(find $CPP -name '*.cpp' | sort); do
            echo "checking $f"
            g++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -fsyntax-only $JNI_INC -I$CPP "$f" || FAIL=1
          done
          exit $FAIL
